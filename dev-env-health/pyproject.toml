[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-env-health"
version = "1.0.0"
description = "Deterministic developer-environment health report CLI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

authors = [
    {name = "Developer"}
]

[project.scripts]
devhealth = "devhealth.cli:main"

[tool.setuptools.packages.find]
include = ["devhealth*"]